name: Reusable Homebrew Update

on:
  workflow_call:
    inputs:
      source_tag:
        description: Validated stable release tag produced by the publisher, for example v1.2.3.
        required: true
        type: string
      tap_repository:
        description: Homebrew tap repository in owner/repo form.
        required: true
        type: string
      tap_default_branch:
        description: Default branch of the tap repository.
        required: false
        default: main
        type: string
      cask_token:
        description: Homebrew Cask token, for example schnee-bar.
        required: true
        type: string
      app_name:
        required: true
        type: string
      bundle_id:
        required: true
        type: string
      description:
        required: true
        type: string
      homepage:
        required: true
        type: string
      dmg_name:
        description: Actual release asset filename for this version.
        required: true
        type: string
      dmg_basename_template:
        description: Cask filename expression, for example MyApp-#{version}.dmg.
        required: true
        type: string
    secrets:
      tap_token:
        description: Short-lived GitHub App installation token preferred; fine-grained PAT is a fallback.
        required: true

permissions:
  contents: read

jobs:
  update-cask:
    name: Open Homebrew Cask update PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate release identity and inputs
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          CASK_TOKEN: ${{ inputs.cask_token }}
          TAP_REPOSITORY: ${{ inputs.tap_repository }}
          DMG_NAME: ${{ inputs.dmg_name }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "source_tag must use stable SemVer form vX.Y.Z." >&2
            exit 1
          fi
          if [[ ! "${CASK_TOKEN}" =~ ^[a-z0-9][a-z0-9._+-]*$ ]]; then
            echo "Unsafe or unsupported Cask token: ${CASK_TOKEN}" >&2
            exit 1
          fi
          if [[ ! "${TAP_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "tap_repository must use owner/repo form." >&2
            exit 1
          fi
          if [[ "${DMG_NAME}" == */* || "${DMG_NAME}" != *.dmg ]]; then
            echo "dmg_name must be a DMG basename, not a path." >&2
            exit 1
          fi

      - name: Checkout trusted publisher automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: source

      - name: Download published checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          DMG_NAME: ${{ inputs.dmg_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${SOURCE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${DMG_NAME}.sha256" \
            --dir release-assets

          checksum_file="release-assets/${DMG_NAME}.sha256"
          if [[ ! -f "${checksum_file}" ]]; then
            echo "Checksum asset not found: ${checksum_file}" >&2
            exit 1
          fi

          sha256="$(awk 'NR == 1 { print $1 }' "${checksum_file}")"
          if [[ ! "${sha256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Invalid SHA-256 value in ${checksum_file}" >&2
            exit 1
          fi
          echo "SHA256=${sha256,,}" >>"${GITHUB_ENV}"

      - name: Clone tap repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.tap_token }}
          TAP_REPOSITORY: ${{ inputs.tap_repository }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "${TAP_REPOSITORY}" tap

      - name: Prepare tap update branch
        id: branch
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TAP_DEFAULT_BRANCH: ${{ inputs.tap_default_branch }}
          CASK_TOKEN: ${{ inputs.cask_token }}
        run: |
          set -euo pipefail
          version="${SOURCE_TAG#v}"
          branch="automation/${CASK_TOKEN}-v${version}"

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch origin "${branch}"
            git switch -C "${branch}" "origin/${branch}"
          else
            git switch "${TAP_DEFAULT_BRANCH}"
            git pull --ff-only origin "${TAP_DEFAULT_BRANCH}"
            git switch -c "${branch}"
          fi

          echo "branch=${branch}" >>"${GITHUB_OUTPUT}"

      - name: Render Cask
        shell: bash
        env:
          CASK_TEMPLATE: source/templates/homebrew/Cask.rb.template
          CASK_TOKEN: ${{ inputs.cask_token }}
          VERSION: ${{ inputs.source_tag }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          DMG_BASENAME: ${{ inputs.dmg_basename_template }}
          APP_NAME: ${{ inputs.app_name }}
          DESCRIPTION: ${{ inputs.description }}
          HOMEPAGE: ${{ inputs.homepage }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          OUTPUT_CASK: tap/Casks/${{ inputs.cask_token }}.rb
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          GITHUB_OWNER="${SOURCE_REPOSITORY%%/*}"
          GITHUB_REPO="${SOURCE_REPOSITORY#*/}"
          export VERSION GITHUB_OWNER GITHUB_REPO
          bash source/scripts/homebrew/render-cask.sh

      - name: Commit and push Cask branch
        id: push
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          CASK_TOKEN: ${{ inputs.cask_token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          version="${SOURCE_TAG#v}"
          cd tap
          git add "Casks/${CASK_TOKEN}.rb"

          if git diff --cached --quiet; then
            echo "changed=false" >>"${GITHUB_OUTPUT}"
          else
            git commit -m "chore(cask): update ${CASK_TOKEN} to ${version}"
            git push --set-upstream origin "${BRANCH}"
            echo "changed=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Open or reuse tap pull request
        if: ${{ steps.push.outputs.changed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.tap_token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TAP_REPOSITORY: ${{ inputs.tap_repository }}
          TAP_DEFAULT_BRANCH: ${{ inputs.tap_default_branch }}
          CASK_TOKEN: ${{ inputs.cask_token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          version="${SOURCE_TAG#v}"
          if gh pr view "${BRANCH}" --repo "${TAP_REPOSITORY}" >/dev/null 2>&1; then
            gh pr view "${BRANCH}" --repo "${TAP_REPOSITORY}" --web=false
          else
            gh pr create \
              --repo "${TAP_REPOSITORY}" \
              --base "${TAP_DEFAULT_BRANCH}" \
              --head "${BRANCH}" \
              --title "chore(cask): update ${CASK_TOKEN} to ${version}" \
              --body "Automated Cask update for ${GITHUB_REPOSITORY}@${SOURCE_TAG}. Verify tap CI before merging."
          fi
