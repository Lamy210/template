name: Swift Quality

on:
  pull_request:
    paths:
      - "**/*.swift"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".github/workflows/swift-quality.yml"
      - ".github/workflows/reusable-swift-quality.yml"
      - "scripts/ci/install-swift-quality-tools.sh"
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".github/workflows/swift-quality.yml"
      - ".github/workflows/reusable-swift-quality.yml"
      - "scripts/ci/install-swift-quality-tools.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-quality:
    # actionlint 1.7.12 still requires GitHub's workspace-relative reusable-workflow syntax.
    uses: ./.github/workflows/reusable-swift-quality.yml # zizmor: ignore[self-repository]
