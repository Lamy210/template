name: Reusable macOS Release

on:
  workflow_call:
    inputs:
      validated_artifact_name:
        description: Publisher-run artifact containing validated release metadata and the unsigned app archive.
        required: true
        type: string
      validated_artifact_id:
        description: Exact Actions Artifact ID produced by the current publisher validation attempt.
        required: true
        type: string
      validated_artifact_digest:
        description: GitHub-provided sha256 digest for the current publisher validation artifact.
        required: true
        type: string
      source_tag:
        description: Validated stable release tag, for example v1.2.3.
        required: true
        type: string
      source_sha:
        description: Validated 40-character source commit SHA bound to the release tag.
        required: true
        type: string
      source_version:
        description: Validated application version without the leading v.
        required: true
        type: string
      source_run_id:
        description: Exact unprivileged Release Build workflow run ID.
        required: true
        type: string
      source_run_attempt:
        description: Exact unprivileged Release Build workflow run attempt.
        required: true
        type: string
      archive_sha256:
        description: Validated archive digest in sha256:<64 lowercase hex> form.
        required: true
        type: string
      app_name:
        description: Application display/bundle directory name without .app.
        required: true
        type: string
      app_path:
        description: Application bundle basename after archive extraction, for example MyApp.app.
        required: true
        type: string
      bundle_id:
        description: Expected CFBundleIdentifier.
        required: true
        type: string
      dmg_name:
        description: Final DMG filename, for example MyApp-1.2.3.dmg.
        required: true
        type: string
      signing_identity:
        description: Full Developer ID Application signing identity.
        required: true
        type: string
      entitlements_path:
        description: Optional entitlements file path from the trusted publisher/default-branch checkout.
        required: false
        default: ""
        type: string
      publish_github_release:
        description: Publish an immutable GitHub Release after notarization and verification.
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout trusted publisher control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify validated handoff artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_ARTIFACT_ID: ${{ inputs.validated_artifact_id }}
          VALIDATED_ARTIFACT_NAME: ${{ inputs.validated_artifact_name }}
          VALIDATED_ARTIFACT_DIGEST: ${{ inputs.validated_artifact_digest }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          PUBLISHER_RUN_ID: ${{ github.run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          artifact_id = os.environ["VALIDATED_ARTIFACT_ID"]
          artifact_name = os.environ["VALIDATED_ARTIFACT_NAME"]
          artifact_digest = os.environ["VALIDATED_ARTIFACT_DIGEST"]
          publisher_run_id = os.environ["PUBLISHER_RUN_ID"]
          publisher_run_attempt = os.environ["PUBLISHER_RUN_ATTEMPT"]
          source_run_id = os.environ["SOURCE_RUN_ID"]
          source_run_attempt = os.environ["SOURCE_RUN_ATTEMPT"]

          if not artifact_id.isdigit() or int(artifact_id) <= 0:
              raise SystemExit("validated artifact ID must be a positive integer")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", artifact_digest) is None:
              raise SystemExit("validated artifact digest must use sha256:<64 lowercase hex>")
          for label, value in (
              ("publisher run ID", publisher_run_id),
              ("publisher run attempt", publisher_run_attempt),
              ("source run ID", source_run_id),
              ("source run attempt", source_run_attempt),
          ):
              if not value.isdigit() or int(value) <= 0:
                  raise SystemExit(f"{label} must be a positive integer")

          expected_name = (
              f"validated-release-input-{publisher_run_id}-{publisher_run_attempt}-"
              f"{source_run_id}-{source_run_attempt}"
          )
          if artifact_name != expected_name:
              raise SystemExit(
                  f"validated artifact name mismatch: expected {expected_name}, got {artifact_name}"
              )

          repository = os.environ["GITHUB_REPOSITORY"]
          raw = subprocess.check_output(
              ["gh", "api", f"/repos/{repository}/actions/artifacts/{artifact_id}"],
              text=True,
          )
          metadata = json.loads(raw)
          if metadata.get("id") != int(artifact_id):
              raise SystemExit("validated artifact API identity mismatch")
          if metadata.get("name") != expected_name:
              raise SystemExit("validated artifact API name mismatch")
          if metadata.get("expired") is not False:
              raise SystemExit("validated artifact is expired or has invalid expiration state")
          if metadata.get("digest") != artifact_digest:
              raise SystemExit("validated artifact API digest mismatch")
          workflow_run = metadata.get("workflow_run")
          if not isinstance(workflow_run, dict) or workflow_run.get("id") != int(publisher_run_id):
              raise SystemExit("validated artifact does not belong to the current publisher run")
          PY

      - name: Download exact validated release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.validated_artifact_id }}
          path: validated-release-input
          merge-multiple: true

      - name: Reverify publisher-owned metadata and archive digest
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_VERSION: ${{ inputs.source_version }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          APP_BASENAME: ${{ inputs.app_path }}
          EXPECTED_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          python3 scripts/release/verify-validated-release-metadata.py \
            --metadata validated-release-input/validated-release-metadata.json \
            --archive validated-release-input/unsigned-macos-app.tar.gz \
            --repository "${GITHUB_REPOSITORY}" \
            --source-run-id "${SOURCE_RUN_ID}" \
            --source-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --source-sha "${SOURCE_SHA}" \
            --source-tag "${SOURCE_TAG}" \
            --source-version "${SOURCE_VERSION}" \
            --publisher-sha "${GITHUB_SHA}" \
            --archive-sha256 "${ARCHIVE_SHA256}" \
            --app-basename "${APP_BASENAME}" \
            --bundle-id "${EXPECTED_BUNDLE_ID}"

      - name: Extract validated unsigned application archive
        shell: bash
        env:
          ARCHIVE_PATH: validated-release-input/unsigned-macos-app.tar.gz
          OUTPUT_DIR: release-input
          APP_BASENAME: ${{ inputs.app_path }}
        run: bash scripts/release/extract-app-artifact.sh

      - name: Revalidate application metadata before secrets
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          EXPECTED_BUNDLE_ID: ${{ inputs.bundle_id }}
          EXPECTED_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Application bundle not found: ${APP_PATH}" >&2
            exit 1
          fi

          plist="${APP_PATH}/Contents/Info.plist"
          actual_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${plist}")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")"
          actual_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${plist}")"

          if [[ "${actual_bundle_id}" != "${EXPECTED_BUNDLE_ID}" ]]; then
            echo "Bundle ID mismatch: expected ${EXPECTED_BUNDLE_ID}, got ${actual_bundle_id}" >&2
            exit 1
          fi
          if [[ "${actual_version}" != "${EXPECTED_VERSION}" ]]; then
            echo "Version mismatch: expected=${EXPECTED_VERSION}, app=${actual_version}" >&2
            exit 1
          fi

          APP_PATH="${APP_PATH}" \
            EXECUTABLE_NAME="${actual_executable}" \
            bash scripts/release/verify-app-executable.sh

      - name: Import Developer ID certificate
        id: certificate
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/release/import-certificate.sh

      - name: Sign application
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          KEYCHAIN_PATH: ${{ steps.certificate.outputs.keychain-path }}
          ENTITLEMENTS_PATH: ${{ inputs.entitlements_path }}
        run: bash scripts/release/sign-app.sh

      - name: Create DMG
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          APP_NAME: ${{ inputs.app_name }}
          OUTPUT_DMG: release-output/${{ inputs.dmg_name }}
        run: bash scripts/release/create-dmg.sh

      - name: Sign DMG
        shell: bash
        env:
          DMG_PATH: release-output/${{ inputs.dmg_name }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          KEYCHAIN_PATH: ${{ steps.certificate.outputs.keychain-path }}
        run: |
          set -euo pipefail
          codesign --force --timestamp \
            --sign "${SIGNING_IDENTITY}" \
            --keychain "${KEYCHAIN_PATH}" \
            "${DMG_PATH}"
          codesign --verify --verbose=2 "${DMG_PATH}"

      - name: Notarize and staple
        shell: bash
        env:
          DMG_PATH: release-output/${{ inputs.dmg_name }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bash scripts/release/notarize.sh

      - name: Verify release
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          DMG_PATH: release-output/${{ inputs.dmg_name }}
        run: bash scripts/release/verify-release.sh

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-macos-release
          path: |
            release-output/${{ inputs.dmg_name }}
            release-output/${{ inputs.dmg_name }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable GitHub Release
        if: ${{ inputs.publish_github_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.source_tag }}
          DMG_PATH: release-output/${{ inputs.dmg_name }}
        run: bash scripts/release/publish-github-release.sh

      - name: Delete temporary signing keychain
        if: ${{ always() }}
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.certificate.outputs.keychain-path }}
        run: |
          if [[ -n "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
