name: Reusable macOS Release

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the unsigned .app artifact uploaded by the secret-free build job.
        required: true
        type: string
      app_name:
        description: Application display/bundle directory name without .app.
        required: true
        type: string
      app_path:
        description: Relative path to the .app inside the downloaded artifact.
        required: true
        type: string
      bundle_id:
        description: Expected CFBundleIdentifier.
        required: true
        type: string
      dmg_name:
        description: Final DMG filename, for example MyApp-1.2.3.dmg.
        required: true
        type: string
      signing_identity:
        description: Full Developer ID Application signing identity.
        required: true
        type: string
      entitlements_path:
        description: Optional entitlements file path in the caller repository.
        required: false
        default: ""
        type: string
      publish_github_release:
        description: Publish/update a GitHub Release after notarization and verification.
        required: false
        default: true
        type: boolean
    secrets:
      certificate_p12_base64:
        required: true
      certificate_password:
        required: true
      app_store_connect_api_key_p8:
        required: true
      app_store_connect_key_id:
        required: true
      app_store_connect_issuer_id:
        required: true

permissions: {}

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write

    steps:
      - name: Validate trusted release context
        shell: bash
        env:
          APP_PATH_INPUT: ${{ inputs.app_path }}
          DMG_NAME: ${{ inputs.dmg_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release workflow must run from a protected tag." >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable SemVer tags in the form vX.Y.Z are accepted." >&2
            exit 1
          fi
          if [[ "${APP_PATH_INPUT}" == /* || "${APP_PATH_INPUT}" == *".."* ]]; then
            echo "app_path must be a safe relative path." >&2
            exit 1
          fi
          if [[ "${DMG_NAME}" == */* || "${DMG_NAME}" != *.dmg ]]; then
            echo "dmg_name must be a DMG basename, not a path." >&2
            exit 1
          fi

      - name: Checkout tagged release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download unsigned application artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: release-input

      - name: Validate application metadata
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          EXPECTED_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Application bundle not found: ${APP_PATH}" >&2
            exit 1
          fi

          plist="${APP_PATH}/Contents/Info.plist"
          actual_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${plist}")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")"
          expected_version="${GITHUB_REF_NAME#v}"

          if [[ "${actual_bundle_id}" != "${EXPECTED_BUNDLE_ID}" ]]; then
            echo "Bundle ID mismatch: expected ${EXPECTED_BUNDLE_ID}, got ${actual_bundle_id}" >&2
            exit 1
          fi
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "Version mismatch: tag=${expected_version}, app=${actual_version}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        id: certificate
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.certificate_p12_base64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.certificate_password }}
        run: bash scripts/release/import-certificate.sh

      - name: Sign application
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          KEYCHAIN_PATH: ${{ steps.certificate.outputs.keychain-path }}
          ENTITLEMENTS_PATH: ${{ inputs.entitlements_path }}
        run: bash scripts/release/sign-app.sh

      - name: Create DMG
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          APP_NAME: ${{ inputs.app_name }}
          OUTPUT_DMG: release-output/${{ inputs.dmg_name }}
        run: bash scripts/release/create-dmg.sh

      - name: Sign DMG
        shell: bash
        env:
          DMG_PATH: release-output/${{ inputs.dmg_name }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          KEYCHAIN_PATH: ${{ steps.certificate.outputs.keychain-path }}
        run: |
          set -euo pipefail
          codesign --force --timestamp \
            --sign "${SIGNING_IDENTITY}" \
            --keychain "${KEYCHAIN_PATH}" \
            "${DMG_PATH}"
          codesign --verify --verbose=2 "${DMG_PATH}"

      - name: Notarize and staple
        shell: bash
        env:
          DMG_PATH: release-output/${{ inputs.dmg_name }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.app_store_connect_api_key_p8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.app_store_connect_key_id }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.app_store_connect_issuer_id }}
        run: bash scripts/release/notarize.sh

      - name: Verify release
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          DMG_PATH: release-output/${{ inputs.dmg_name }}
        run: bash scripts/release/verify-release.sh

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-macos-release
          path: |
            release-output/${{ inputs.dmg_name }}
            release-output/${{ inputs.dmg_name }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_github_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PATH: release-output/${{ inputs.dmg_name }}
        run: |
          set -euo pipefail
          checksum="${DMG_PATH}.sha256"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${DMG_PATH}" "${checksum}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${DMG_PATH}" \
              "${checksum}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi

      - name: Delete temporary signing keychain
        if: ${{ always() }}
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.certificate.outputs.keychain-path }}
        run: |
          if [[ -n "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
