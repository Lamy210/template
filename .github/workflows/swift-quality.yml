name: Swift Quality

on:
  pull_request:
    paths:
      - "**/*.swift"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".github/workflows/swift-quality.yml"
      - ".github/workflows/reusable-swift-quality.yml"
      - "scripts/ci/install-swift-quality-tools.sh"
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".github/workflows/swift-quality.yml"
      - ".github/workflows/reusable-swift-quality.yml"
      - "scripts/ci/install-swift-quality-tools.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-quality:
    uses: $/.github/workflows/reusable-swift-quality.yml
