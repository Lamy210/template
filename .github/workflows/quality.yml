name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned workflow and shell linters
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          printf '%s\n' "$(go env GOPATH)/bin" >>"${GITHUB_PATH}"

          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: actionlint
        shell: bash
        run: actionlint

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts -type f -name '*.sh' -print0 2>/dev/null || true)
          if (( ${#files[@]} > 0 )); then
            shellcheck "${files[@]}"
          fi

      - name: shfmt
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d scripts ]]; then
            shfmt -d -i 2 -ci scripts
          fi

      - name: CI tool download policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_tool_installer_retry_policy -v

      - name: Dependabot configuration policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_dependabot_config -v

      - name: Artifact rerun policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_upload_artifact_rerun_policy -v

      - name: Artifact download identity policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_download_artifact_identity_policy -v

      - name: Actions supply-chain policy
        shell: bash
        run: |
          python3 -m unittest \
            scripts.ci.test_workflow_yaml_keys \
            scripts.ci.test_actions_supply_chain_policy \
            -v

      - name: Workflow token permission policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_workflow_permission_policy -v

      - name: Workflow trust-boundary policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_workflow_trust_boundary_policy -v

      - name: Workflow key canonicalization policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_workflow_key_policy -v

      - name: Workflow anchor and alias policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_workflow_alias_policy -v

      - name: Workflow flow mapping policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_workflow_flow_mapping_policy -v

      - name: Shell expression interpolation policy
        shell: bash
        run: python3 -m unittest scripts.ci.test_run_expression_policy -v

      - name: Ruleset governance validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            scripts.common.test_github_remote \
            scripts.common.test_repository_identity \
            scripts.common.test_repository_name \
            scripts.common.test_workflow_identity \
            scripts.ci.test_validate_rulesets \
            scripts.ci.test_validate_rulesets_portability \
            scripts.ci.test_audit_effective_rules \
            scripts.ci.test_audit_main_ruleset \
            scripts.ci.test_audit_release_tag_ruleset \
            scripts.ci.test_governance_audit_workflow \
            scripts.ci.test_immutable_releases_setting \
            scripts.ci.test_live_audit_repository_names \
            scripts.ci.test_repository_merge_settings \
            scripts.ci.test_release_tag_immutability_proof \
            scripts.template.test_doctor \
            -v
          python3 scripts/ci/validate_rulesets.py
          bash scripts/common/test-repository-name.sh
          bash scripts/common/test-shell-repository-entrypoints.sh
          bash scripts/ci/test-audit-live-immutable-releases.sh
          bash scripts/ci/test-audit-live-repository-merge-settings.sh
          bash scripts/setup/test-apply-repository-merge-settings.sh
          bash scripts/setup/test-apply-main-ruleset.sh
          bash scripts/setup/test-reconcile-solo-governance.sh

      - name: Release isolation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            scripts.release.test_release_provenance \
            scripts.release.test_release_attestation \
            scripts.release.test_artifact_identity \
            scripts.release.test_release_environment_policy \
            scripts.release.test_release_environment_runtime_proof \
            scripts.release.test_post_split_runtime_proof \
            scripts.release.test_post_split_runtime_proof_runner \
            scripts.release.test_post_split_proof_evidence \
            scripts.release.test_unprivileged_release_build_workflow \
            scripts.release.test_runtime_proof_artifact \
            scripts.release.test_atomic_directory_publish \
            scripts.release.test_capture_release_asset \
            scripts.release.test_secure_file_snapshot \
            scripts.release.test_validate_actions_artifact \
            scripts.release.test_validate_release_input \
            scripts.release.test_validate_release_output_name \
            scripts.release.test_publisher_attempt_binding \
            scripts.release.test_validated_artifact \
            scripts.release.test_verified_release_artifact \
            scripts.release.test_verified_release_handoff \
            scripts.release.test_verified_release_archive \
            scripts.release.test_verified_release_payload \
            scripts.release.test_published_release_assets \
            scripts.release.test_release_download_identity \
            scripts.release.test_release_state \
            scripts.release.test_release_workflow_contract \
            scripts.release.test_release_publisher_workflow_contract \
            scripts.release.test_privileged_release_workflow_contract \
            scripts.release.test_homebrew_publisher_workflow_contract \
            scripts.homebrew.test_release_checksum \
            scripts.homebrew.test_cask_asset \
            scripts.homebrew.test_cask_output_path \
            scripts.homebrew.test_tap_remote \
            scripts.homebrew.test_tap_repository_identity \
            scripts.homebrew.test_tap_pr_selection \
            scripts.release.test_verify_validated_release_metadata \
            -v
          bash scripts/release/test-resolve-release-build-artifact.sh
          bash scripts/release/test-source-artifact-repository-binding.sh
          bash scripts/release/test-verify-release-source.sh
          bash scripts/release/test-download-exact-release-assets.sh

      - name: Release artifact handoff regression
        shell: bash
        run: bash scripts/release/test-app-artifact-handoff.sh

      - name: GitHub Release immutability regression
        shell: bash
        run: bash scripts/release/test-publish-github-release.sh

      - name: DMG input validation regression
        shell: bash
        run: bash scripts/release/test-create-dmg-input-validation.sh

      - name: Homebrew Cask renderer interpolation regression
        shell: bash
        run: bash scripts/homebrew/test-render-cask.sh

      - name: Homebrew Cask renderer smoke test
        shell: bash
        env:
          CASK_TOKEN: example-app
          VERSION: 1.2.3
          SHA256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          GITHUB_OWNER: example
          GITHUB_REPO: example-app
          DMG_BASENAME: ExampleApp-v#{version}.dmg
          APP_NAME: ExampleApp
          DESCRIPTION: Example macOS application
          HOMEPAGE: https://example.com
          BUNDLE_ID: com.example.ExampleApp
          CASK_OUTPUT_ROOT: ${{ runner.temp }}
          OUTPUT_CASK: ${{ runner.temp }}/example-app.rb
        run: |
          set -euo pipefail
          bash scripts/homebrew/render-cask.sh
          ruby -c "${OUTPUT_CASK}"
          grep -F 'version "1.2.3"' "${OUTPUT_CASK}" >/dev/null
          grep -F 'app "ExampleApp.app"' "${OUTPUT_CASK}" >/dev/null

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks CLI
        shell: bash
        run: bash scripts/ci/install-gitleaks.sh

      - name: Scan repository history for secrets
        shell: bash
        run: gitleaks git --redact --verbose .

  actions-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          version: 1.30.1

  release-artifact-package:
    name: Release artifact package fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.fixture_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.fixture_upload.outputs.artifact-digest }}
      artifact_name: release-app-permission-fixture-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create and package executable app fixture
        shell: bash
        run: |
          set -euo pipefail
          executable='build/TestApp.app/Contents/MacOS/TestApp'
          mkdir -p "$(dirname "${executable}")"
          printf '#!/usr/bin/env bash\nexit 0\n' >"${executable}"
          chmod 0755 "${executable}"
          APP_PATH='build/TestApp.app' \
            OUTPUT_ARCHIVE='build/unsigned-macos-app.tar.gz' \
            bash scripts/release/package-app-artifact.sh

      - name: Upload packaged app fixture
        id: fixture_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-app-permission-fixture-${{ github.run_attempt }}
          path: build/unsigned-macos-app.tar.gz
          if-no-files-found: error
          retention-days: 1

  release-artifact-roundtrip:
    name: Release artifact permission roundtrip
    needs: release-artifact-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate exact packaged app fixture identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.release-artifact-package.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.release-artifact-package.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.release-artifact-package.outputs.artifact_name }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/release-app-permission-fixture.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" >"${metadata}"
          python3 scripts/ci/current_run_artifact_identity.py \
            --metadata "${metadata}" \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-name "${ARTIFACT_NAME}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --run-id "${EXPECTED_RUN_ID}" \
            --repository-id "${EXPECTED_REPOSITORY_ID}" \
            --head-repository-id "${EXPECTED_HEAD_REPOSITORY_ID}" \
            --source-sha "${EXPECTED_SOURCE_SHA}"

      - name: Download packaged app fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release-artifact-package.outputs.artifact_id }}
          path: downloaded-artifact
          merge-multiple: true

      - name: Extract and verify executable permission
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH='downloaded-artifact/unsigned-macos-app.tar.gz' \
            OUTPUT_DIR='release-input' \
            APP_BASENAME='TestApp.app' \
            bash scripts/release/extract-app-artifact.sh
          APP_PATH='release-input/TestApp.app' \
            EXECUTABLE_NAME='TestApp' \
            bash scripts/release/verify-app-executable.sh

  required-gate:
    name: Required gate
    if: ${{ always() }}
    needs:
      - repository-hygiene
      - secret-scan
      - actions-security
      - release-artifact-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Require all foundation checks
        shell: bash
        env:
          REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          ACTIONS_SECURITY: ${{ needs.actions-security.result }}
          RELEASE_ARTIFACT_ROUNDTRIP: ${{ needs.release-artifact-roundtrip.result }}
        run: |
          set -euo pipefail
          [[ "${REPOSITORY_HYGIENE}" == success ]]
          [[ "${SECRET_SCAN}" == success ]]
          [[ "${ACTIONS_SECURITY}" == success ]]
          [[ "${RELEASE_ARTIFACT_ROUNDTRIP}" == success ]]
