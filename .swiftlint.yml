strict: false

excluded:
  - .build
  - DerivedData
  - vendor

# Analyzer rules require `swiftlint analyze` with a clean compiler log.
# They are intentionally documented here even though the default reusable
# workflow runs `swiftlint lint`; see docs/QUALITY.md for enabling analysis.
analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - closure_body_length
  - closure_spacing
  - contains_over_filter_count
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# Complexity / maintainability policy. CI runs these rules in a dedicated
# complexity gate before the full SwiftLint pass so failures are easy to triage.
file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

closure_body_length:
  warning: 40
  error: 80

cyclomatic_complexity:
  warning: 12
  error: 20
  ignores_case_statements: false

type_body_length:
  warning: 300
  error: 500

function_parameter_count:
  warning: 6
  error: 8
  ignores_default_parameters: true

large_tuple:
  warning: 3
  error: 4

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 2
  ignore_coding_keys: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

reporter: "github-actions-logging"
