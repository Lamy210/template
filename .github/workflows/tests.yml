name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify tests
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.policy.outputs.configured }}
      configuration_error: ${{ steps.policy.outputs.configuration_error }}
      integration_enabled: ${{ steps.policy.outputs.integration_enabled }}
      integration_required: ${{ steps.policy.outputs.integration_required }}
      coverage_enabled: ${{ steps.policy.outputs.coverage_enabled }}
      coverage_required: ${{ steps.policy.outputs.coverage_required }}
    env:
      MACOS_TEST_ADAPTER: ${{ vars.MACOS_TEST_ADAPTER }}
      MACOS_INTEGRATION_ENABLED: ${{ vars.MACOS_INTEGRATION_ENABLED }}
      MACOS_INTEGRATION_REQUIRED: ${{ vars.MACOS_INTEGRATION_REQUIRED }}
      MACOS_COVERAGE_ENABLED: ${{ vars.MACOS_COVERAGE_ENABLED }}
      MACOS_COVERAGE_REQUIRED: ${{ vars.MACOS_COVERAGE_REQUIRED }}
    steps:
      - name: Classify configured test subsystems
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          adapter="${MACOS_TEST_ADAPTER}"
          configured=false
          configuration_error=false

          case "${adapter}" in
            "") ;;
            xcode | swiftpm) configured=true ;;
            *) configuration_error=true ;;
          esac

          integration_enabled=false
          if [[ "${configured}" == "true" && "${MACOS_INTEGRATION_ENABLED}" == "true" ]]; then
            integration_enabled=true
          fi

          coverage_enabled=false
          if [[ "${configured}" == "true" && "${MACOS_COVERAGE_ENABLED}" == "true" ]]; then
            coverage_enabled=true
          fi

          integration_required=false
          if [[ "${integration_enabled}" == "true" && "${MACOS_INTEGRATION_REQUIRED}" == "true" ]]; then
            integration_required=true
          fi

          coverage_required=false
          if [[ "${coverage_enabled}" == "true" && "${MACOS_COVERAGE_REQUIRED}" != "false" ]]; then
            coverage_required=true
          fi

          {
            echo "configured=${configured}"
            echo "configuration_error=${configuration_error}"
            echo "integration_enabled=${integration_enabled}"
            echo "integration_required=${integration_required}"
            echo "coverage_enabled=${coverage_enabled}"
            echo "coverage_required=${coverage_required}"
          } >>"${GITHUB_OUTPUT}"

  unit-run:
    name: Unit runner
    needs: classify
    if: ${{ needs.classify.outputs.configured == 'true' }}
    uses: ./.github/workflows/reusable-swift-tests.yml
    permissions:
      contents: read
      actions: read
    with:
      check_name: Unit
      adapter: ${{ vars.MACOS_TEST_ADAPTER }}
      working_directory: ${{ vars.MACOS_TEST_WORKING_DIRECTORY || '.' }}
      project_path: ${{ vars.MACOS_TEST_PROJECT_PATH || '' }}
      workspace_path: ${{ vars.MACOS_TEST_WORKSPACE_PATH || '' }}
      scheme: ${{ vars.MACOS_TEST_SCHEME || '' }}
      test_plan: ${{ vars.MACOS_UNIT_TEST_PLAN || vars.MACOS_TEST_PLAN || '' }}
      test_filter: ${{ vars.MACOS_UNIT_TEST_FILTER || '' }}
      destination: ${{ vars.MACOS_TEST_DESTINATION || 'platform=macOS,arch=arm64' }}
      enable_coverage: ${{ needs.classify.outputs.coverage_enabled == 'true' }}
      coverage_max_regression: ${{ vars.MACOS_COVERAGE_MAX_REGRESSION || '0.001' }}
      bootstrap_coverage: ${{ vars.MACOS_COVERAGE_BOOTSTRAP == 'true' }}
      coverage_artifact_name: ${{ vars.MACOS_COVERAGE_ARTIFACT_NAME || 'coverage-baseline' }}

  unit:
    name: Unit
    needs:
      - classify
      - unit-run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish Unit result
        shell: bash
        env:
          CONFIGURED: ${{ needs.classify.outputs.configured }}
          RESULT: ${{ needs.unit-run.result }}
        run: |
          set -euo pipefail
          if [[ "${CONFIGURED}" != "true" ]]; then
            echo "Unit: DISABLED / NOT CONFIGURED"
            exit 0
          fi
          [[ "${RESULT}" == "success" ]] || {
            echo "Unit runner result: ${RESULT}" >&2
            exit 1
          }

  integration-run:
    name: Integration runner
    needs: classify
    if: ${{ needs.classify.outputs.integration_enabled == 'true' }}
    uses: ./.github/workflows/reusable-swift-tests.yml
    permissions:
      contents: read
    with:
      check_name: Integration
      adapter: ${{ vars.MACOS_TEST_ADAPTER }}
      working_directory: ${{ vars.MACOS_TEST_WORKING_DIRECTORY || '.' }}
      project_path: ${{ vars.MACOS_TEST_PROJECT_PATH || '' }}
      workspace_path: ${{ vars.MACOS_TEST_WORKSPACE_PATH || '' }}
      scheme: ${{ vars.MACOS_TEST_SCHEME || '' }}
      test_plan: ${{ vars.MACOS_INTEGRATION_TEST_PLAN || '' }}
      test_filter: ${{ vars.MACOS_INTEGRATION_TEST_FILTER || '' }}
      destination: ${{ vars.MACOS_TEST_DESTINATION || 'platform=macOS,arch=arm64' }}
      enable_coverage: false

  integration:
    name: Integration
    needs:
      - classify
      - integration-run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish Integration result
        shell: bash
        env:
          ENABLED: ${{ needs.classify.outputs.integration_enabled }}
          RESULT: ${{ needs.integration-run.result }}
        run: |
          set -euo pipefail
          if [[ "${ENABLED}" != "true" ]]; then
            echo "Integration: DISABLED / NOT APPLICABLE"
            exit 0
          fi
          [[ "${RESULT}" == "success" ]] || {
            echo "Integration runner result: ${RESULT}" >&2
            exit 1
          }

  e2e:
    name: E2E
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report current Task 7 state
        run: echo "E2E is disabled until the dedicated deterministic E2E workflow is wired."

  visual:
    name: Visual
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report current Task 7 state
        run: echo "Visual regression is disabled until the dedicated capture workflow is wired."

  coverage:
    name: Coverage
    needs:
      - classify
      - unit-run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish Coverage result
        shell: bash
        env:
          ENABLED: ${{ needs.classify.outputs.coverage_enabled }}
          UNIT_RESULT: ${{ needs.unit-run.result }}
        run: |
          set -euo pipefail
          if [[ "${ENABLED}" != "true" ]]; then
            echo "Coverage: DISABLED / NOT APPLICABLE"
            exit 0
          fi
          [[ "${UNIT_RESULT}" == "success" ]] || {
            echo "Coverage execution result follows Unit runner: ${UNIT_RESULT}" >&2
            exit 1
          }

  required-gate:
    name: Tests / Required Gate
    needs:
      - classify
      - unit
      - integration
      - e2e
      - visual
      - coverage
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout policy evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build normalized subsystem policy
        shell: bash
        env:
          CONFIGURED: ${{ needs.classify.outputs.configured }}
          CONFIGURATION_ERROR: ${{ needs.classify.outputs.configuration_error }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_ENABLED: ${{ needs.classify.outputs.integration_enabled }}
          INTEGRATION_REQUIRED: ${{ needs.classify.outputs.integration_required }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COVERAGE_ENABLED: ${{ needs.classify.outputs.coverage_enabled }}
          COVERAGE_REQUIRED: ${{ needs.classify.outputs.coverage_required }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/required-gate-input.json" <<'PY'
          import json
          import os
          import sys

          output = sys.argv[1]
          configured = os.environ["CONFIGURED"] == "true"
          configuration_error = os.environ["CONFIGURATION_ERROR"] == "true"
          integration_enabled = os.environ["INTEGRATION_ENABLED"] == "true"
          coverage_enabled = os.environ["COVERAGE_ENABLED"] == "true"

          if configuration_error:
              unit = {"status": "disabled", "required": True, "classification": "not-applicable"}
          elif configured:
              unit = {
                  "status": os.environ["UNIT_RESULT"],
                  "required": True,
                  "classification": "applicable",
              }
          else:
              unit = {"status": "disabled", "required": False, "classification": "not-applicable"}

          integration = (
              {
                  "status": os.environ["INTEGRATION_RESULT"],
                  "required": os.environ["INTEGRATION_REQUIRED"] == "true",
                  "classification": "applicable",
              }
              if integration_enabled
              else {"status": "disabled", "required": False, "classification": "not-applicable"}
          )
          coverage = (
              {
                  "status": os.environ["COVERAGE_RESULT"],
                  "required": os.environ["COVERAGE_REQUIRED"] == "true",
                  "classification": "applicable",
              }
              if coverage_enabled
              else {"status": "disabled", "required": False, "classification": "not-applicable"}
          )

          payload = {
              "schemaVersion": 1,
              "subsystems": {
                  "Unit": unit,
                  "Integration": integration,
                  "E2E": {"status": "disabled", "required": False, "classification": "not-applicable"},
                  "Visual": {"status": "disabled", "required": False, "classification": "not-applicable"},
                  "Coverage": coverage,
              },
          }
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Evaluate Required Gate
        shell: bash
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/required-gate-result.json"
          set +e
          python3 scripts/test/evaluate-required-gate.py \
            --input "${RUNNER_TEMP}/required-gate-input.json" \
            >"${result}"
          status=$?
          set -e

          cat "${result}"
          {
            echo "### Tests / Required Gate"
            echo '```json'
            cat "${result}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit "${status}"
