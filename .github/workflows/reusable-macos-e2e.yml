name: Reusable macOS E2E

on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        default: .
        type: string
      project_path:
        required: false
        default: ""
        type: string
      workspace_path:
        required: false
        default: ""
        type: string
      scheme:
        required: true
        type: string
      test_plan:
        required: false
        default: ""
        type: string
      destination:
        required: false
        default: platform=macOS,arch=arm64
        type: string
      developer_dir:
        required: false
        default: /Applications/Xcode_26.6.app/Contents/Developer
        type: string
      profile_id:
        required: false
        default: macos-26-arm64-xcode-26.6
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: Standard macOS E2E
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ inputs.developer_dir }}
      WORKING_DIRECTORY: ${{ inputs.working_directory }}
      PROJECT_PATH: ${{ inputs.project_path }}
      WORKSPACE_PATH: ${{ inputs.workspace_path }}
      SCHEME: ${{ inputs.scheme }}
      TEST_PLAN: ${{ inputs.test_plan }}
      TEST_DESTINATION: ${{ inputs.destination }}
      VISUAL_PROFILE_ID: ${{ inputs.profile_id }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
