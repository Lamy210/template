name: Reusable macOS E2E

on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        default: .
        type: string
      project_path:
        required: false
        default: ""
        type: string
      workspace_path:
        required: false
        default: ""
        type: string
      scheme:
        required: true
        type: string
      test_plan:
        required: false
        default: ""
        type: string
      destination:
        required: false
        default: platform=macOS,arch=arm64
        type: string
      developer_dir:
        required: false
        default: /Applications/Xcode_26.6.app/Contents/Developer
        type: string
      profile_id:
        required: false
        default: macos-26-arm64-xcode-26.6
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: Standard macOS E2E
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ inputs.developer_dir }}
      WORKING_DIRECTORY: ${{ inputs.working_directory }}
      PROJECT_PATH: ${{ inputs.project_path }}
      WORKSPACE_PATH: ${{ inputs.workspace_path }}
      SCHEME: ${{ inputs.scheme }}
      TEST_PLAN: ${{ inputs.test_plan }}
      TEST_DESTINATION: ${{ inputs.destination }}
      VISUAL_PROFILE_ID: ${{ inputs.profile_id }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run deterministic E2E
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: bash scripts/test/run-macos-e2e.sh

      - name: Collect visual profile metadata
        if: ${{ always() }}
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: bash scripts/visual/collect-e2e-profile.sh

      - name: Export xcresult attachments
        if: ${{ always() }}
        run: bash scripts/test/export-e2e-diagnostics.sh

      - name: Upload visual capture bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-e2e-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/visual
          if-no-files-found: error
          retention-days: 14

      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e.xcresult
            ${{ runner.temp }}/e2e-attachments
          if-no-files-found: warn
          retention-days: 14
