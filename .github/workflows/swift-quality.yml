  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-quality:
    # actionlint 1.7.12 still requires GitHub's workspace-relative reusable-workflow syntax.
    uses: ./.github/workflows/reusable-swift-quality.yml # zizmor: ignore[self-repository]
