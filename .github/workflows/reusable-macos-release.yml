name: Reusable macOS Release

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the Actions Artifact containing the unsigned application archive.
        required: true
        type: string
      artifact_archive_name:
        description: Tar.gz filename inside the downloaded Actions Artifact.
        required: true
        type: string
      app_name:
        description: Application display/bundle directory name without .app.
        required: true
        type: string
      app_path:
        description: Application bundle basename after archive extraction, for example MyApp.app.
        required: true
        type: string
      bundle_id:
        description: Expected CFBundleIdentifier.
        required: true
        type: string
      dmg_name:
        description: Final DMG filename, for example MyApp-1.2.3.dmg.
        required: true
        type: string
      signing_identity:
        description: Full Developer ID Application signing identity.
        required: true
        type: string
      entitlements_path:
        description: Optional entitlements file path in the caller repository.
        required: false
        default: ""
        type: string
      release_branch:
        description: Trusted long-lived branch that release tag commits must belong to.
        required: false
        default: main
        type: string
      publish_github_release:
        description: Publish an immutable GitHub Release after notarization and verification.
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write

    steps:
      - name: Validate trusted release context
        shell: bash
        env:
          APP_PATH_INPUT: ${{ inputs.app_path }}
          ARTIFACT_ARCHIVE_NAME: ${{ inputs.artifact_archive_name }}
          DMG_NAME: ${{ inputs.dmg_name }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release workflow must run from a protected tag." >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable SemVer tags in the form vX.Y.Z are accepted." >&2
            exit 1
          fi
          if [[ "${APP_PATH_INPUT}" == */* || "${APP_PATH_INPUT}" != *.app ]]; then
            echo "app_path must be a .app basename." >&2
            exit 1
          fi
          if [[ "${ARTIFACT_ARCHIVE_NAME}" == */* || "${ARTIFACT_ARCHIVE_NAME}" != *.tar.gz ]]; then
            echo "artifact_archive_name must be a .tar.gz basename." >&2
            exit 1
          fi
          if [[ "${DMG_NAME}" == */* || "${DMG_NAME}" != *.dmg ]]; then
            echo "dmg_name must be a DMG basename, not a path." >&2
            exit 1
          fi
          if ! git check-ref-format --branch "${RELEASE_BRANCH}" >/dev/null 2>&1; then
            echo "release_branch is not a valid branch name: ${RELEASE_BRANCH}" >&2
            exit 1
          fi

      - name: Checkout tagged release source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag belongs to trusted branch
        shell: bash
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -euo pipefail
          trusted_ref="refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git show-ref --verify --quiet "${trusted_ref}"; then
            echo "Trusted release branch is unavailable: ${trusted_ref}" >&2
            exit 1
          fi

          release_commit="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "${release_commit}" "${trusted_ref}"; then
            echo "Release tag ${GITHUB_REF_NAME} points to ${release_commit}, which is not contained in ${RELEASE_BRANCH}." >&2
            exit 1
          fi

      - name: Download unsigned application artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: release-artifact

      - name: Extract unsigned application archive
        shell: bash
        env:
          ARCHIVE_PATH: release-artifact/${{ inputs.artifact_archive_name }}
          OUTPUT_DIR: release-input
          APP_BASENAME: ${{ inputs.app_path }}
        run: bash scripts/release/extract-app-artifact.sh

      - name: Validate application metadata
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          EXPECTED_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Application bundle not found: ${APP_PATH}" >&2
            exit 1
          fi

          plist="${APP_PATH}/Contents/Info.plist"
          actual_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${plist}")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")"
          actual_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${plist}")"
          expected_version="${GITHUB_REF_NAME#v}"

          if [[ "${actual_bundle_id}" != "${EXPECTED_BUNDLE_ID}" ]]; then
            echo "Bundle ID mismatch: expected ${EXPECTED_BUNDLE_ID}, got ${actual_bundle_id}" >&2
            exit 1
          fi
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "Version mismatch: tag=${expected_version}, app=${actual_version}" >&2
            exit 1
          fi

          APP_PATH="${APP_PATH}" \
            EXECUTABLE_NAME="${actual_executable}" \
            bash scripts/release/verify-app-executable.sh

      - name: Import Developer ID certificate
        id: certificate
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/release/import-certificate.sh

      - name: Sign application
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          KEYCHAIN_PATH: ${{ steps.certificate.outputs.keychain-path }}
          ENTITLEMENTS_PATH: ${{ inputs.entitlements_path }}
        run: bash scripts/release/sign-app.sh

      - name: Create DMG
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          APP_NAME: ${{ inputs.app_name }}
          OUTPUT_DMG: release-output/${{ inputs.dmg_name }}
        run: bash scripts/release/create-dmg.sh

      - name: Sign DMG
        shell: bash
        env:
          DMG_PATH: release-output/${{ inputs.dmg_name }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          KEYCHAIN_PATH: ${{ steps.certificate.outputs.keychain-path }}
        run: |
          set -euo pipefail
          codesign --force --timestamp \
            --sign "${SIGNING_IDENTITY}" \
            --keychain "${KEYCHAIN_PATH}" \
            "${DMG_PATH}"
          codesign --verify --verbose=2 "${DMG_PATH}"

      - name: Notarize and staple
        shell: bash
        env:
          DMG_PATH: release-output/${{ inputs.dmg_name }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bash scripts/release/notarize.sh

      - name: Verify release
        shell: bash
        env:
          APP_PATH: release-input/${{ inputs.app_path }}
          DMG_PATH: release-output/${{ inputs.dmg_name }}
        run: bash scripts/release/verify-release.sh

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-macos-release
          path: |
            release-output/${{ inputs.dmg_name }}
            release-output/${{ inputs.dmg_name }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable GitHub Release
        if: ${{ inputs.publish_github_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          DMG_PATH: release-output/${{ inputs.dmg_name }}
        run: bash scripts/release/publish-github-release.sh

      - name: Delete temporary signing keychain
        if: ${{ always() }}
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.certificate.outputs.keychain-path }}
        run: |
          if [[ -n "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
