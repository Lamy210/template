# actionlint v1.7.12 predates GitHub's July 2026 self-repository `$/` syntax.
# Keep these path-scoped compatibility ignores until actionlint understands that syntax.
paths:
  .github/workflows/tests.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/reusable-swift-tests\.yml" at "uses" is not following the format'
      - 'reusable workflow call "\$/\.github/workflows/reusable-macos-e2e\.yml" at "uses" is not following the format'
      - 'reusable workflow call "\$/\.github/workflows/reusable-visual-regression\.yml" at "uses" is not following the format'
  .github/workflows/optional-subsystem-runtime-tests.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/reusable-swift-tests\.yml" at "uses" is not following the format'
  .github/workflows/test-profile-adoption.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/reusable-swift-tests\.yml" at "uses" is not following the format'
      - 'reusable workflow call "\$/\.github/workflows/reusable-macos-e2e\.yml" at "uses" is not following the format'
