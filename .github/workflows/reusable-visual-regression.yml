name: Reusable Visual Regression

on:
  workflow_call:
    inputs:
      manifest_path:
        description: Repository-relative visual manifest path.
        required: false
        default: Tests/VisualRegression/visual-regression.json
        type: string
      current_artifact_name:
        description: Exact current visual capture artifact name from this workflow run.
        required: true
        type: string
      current_sha:
        description: Source commit SHA represented by the current capture.
        required: true
        type: string
      trusted_workflow:
        description: Canonical workflow file that publishes trusted rolling baselines.
        required: false
        default: tests.yml
        type: string
      trusted_events:
        description: Comma-separated trusted workflow events eligible to provide rolling baselines.
        required: false
        default: push
        type: string
      baseline_artifact_name:
        description: Exact trusted rolling baseline artifact name.
        required: false
        default: visual-baseline
        type: string
      bootstrap_rolling:
        description: Permit repository-wide bootstrap only when no trusted baseline exists.
        required: false
        default: false
        type: boolean
    outputs:
      baseline_available:
        description: Whether a trusted rolling baseline was resolved.
        value: ${{ jobs.visual.outputs.baseline_available }}
      baseline_run_id:
        description: Trusted baseline source run ID, empty during bootstrap.
        value: ${{ jobs.visual.outputs.baseline_run_id }}

permissions:
  contents: read
  actions: read

jobs:
  visual:
    name: Visual comparison
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      baseline_available: ${{ steps.baseline.outputs.available }}
      baseline_run_id: ${{ steps.baseline.outputs.run_id }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      CURRENT_ARTIFACT_NAME: ${{ inputs.current_artifact_name }}
      CURRENT_SHA: ${{ inputs.current_sha }}
      TRUSTED_WORKFLOW: ${{ inputs.trusted_workflow }}
      TRUSTED_EVENTS: ${{ inputs.trusted_events }}
      BASELINE_ARTIFACT_NAME: ${{ inputs.baseline_artifact_name }}
      BOOTSTRAP_ROLLING: ${{ inputs.bootstrap_rolling }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download current visual capture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.current_artifact_name }}
          path: artifacts/visual

      - name: Validate visual manifest
        run: >-
          swift run --package-path Tools/VisualDiff visual-diff validate-manifest
          --manifest "${MANIFEST_PATH}"
          --repo-root "${GITHUB_WORKSPACE}"

      - name: Resolve trusted rolling baseline
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_root="${RUNNER_TEMP}/visual-baseline"
          baseline_run_file="${RUNNER_TEMP}/visual-baseline-run-id.txt"

          set +e
          bash scripts/ci/resolve-trusted-main-artifact.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow "${TRUSTED_WORKFLOW}" \
            --trusted-events "${TRUSTED_EVENTS}" \
            --artifact "${BASELINE_ARTIFACT_NAME}" \
            --output "${baseline_root}" \
            >"${baseline_run_file}"
          resolver_status=$?
          set -e

          if ((resolver_status == 4)); then
            if [[ "${BOOTSTRAP_ROLLING}" != "true" ]]; then
              echo "Trusted rolling baseline is missing and bootstrap is disabled." >&2
              exit 1
            fi
            echo "available=false" >>"${GITHUB_OUTPUT}"
            echo "run_id=" >>"${GITHUB_OUTPUT}"
            echo "BOOTSTRAP: no trusted rolling baseline exists yet." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          ((resolver_status == 0)) || exit "${resolver_status}"

          baseline_run_id="$(tr -d '[:space:]' <"${baseline_run_file}")"
          [[ "${baseline_run_id}" =~ ^[0-9]+$ ]] || {
            echo "Trusted baseline resolver returned an invalid run ID." >&2
            exit 2
          }

          python3 scripts/visual/validate-baseline-provenance.py \
            --resolver-metadata "${baseline_root}/resolver-metadata.json" \
            --bundle-manifest "${baseline_root}/bundle-manifest.json" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow "${TRUSTED_WORKFLOW}" \
            --expected-artifact "${BASELINE_ARTIFACT_NAME}" \
            --expected-events "${TRUSTED_EVENTS}"

          echo "available=true" >>"${GITHUB_OUTPUT}"
          echo "run_id=${baseline_run_id}" >>"${GITHUB_OUTPUT}"

      - name: Compare visual captures
        shell: bash
        env:
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
        run: |
          set -euo pipefail
          rolling_root=""
          rolling_profile=""
          if [[ "${BASELINE_AVAILABLE}" == "true" ]]; then
            rolling_root="${RUNNER_TEMP}/visual-baseline"
            rolling_profile="${RUNNER_TEMP}/visual-baseline/profile.json"
          fi

          compare_log="${RUNNER_TEMP}/visual-compare.log"
          set +e
          swift run --package-path Tools/VisualDiff visual-diff compare-manifest \
            --manifest "${MANIFEST_PATH}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --current-profile "artifacts/visual/profile.json" \
            --rolling-root "${rolling_root}" \
            --rolling-profile "${rolling_profile}" \
            --output "artifacts/visual/report" \
            --current-sha "${CURRENT_SHA}" \
            --baseline-run-id "${BASELINE_RUN_ID}" \
            --bootstrap-rolling "${BOOTSTRAP_ROLLING}" \
            2>&1 | tee "${compare_log}"
          compare_status=${PIPESTATUS[0]}
          set -e

          {
            echo "### Visual regression"
            echo '```text'
            cat "${compare_log}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit "${compare_status}"

      - name: Upload visual comparison report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/visual/report
            ${{ runner.temp }}/visual-baseline/resolver-metadata.json
          if-no-files-found: warn
          retention-days: 14
