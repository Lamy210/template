name: Governance Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  effective-main-rules:
    name: Effective main rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit effective default-branch rules
        shell: bash
        run: bash scripts/ci/audit-live-main-rules.sh "${{ github.repository }}"
